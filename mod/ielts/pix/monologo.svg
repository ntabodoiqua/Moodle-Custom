<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" width="24" height="24">
  <!-- Book/Document base -->
  <rect x="4" y="3" width="16" height="18" rx="1" fill="none" stroke="black" stroke-width="1.5"/>
  
  <!-- Pages effect -->
  <line x1="6" y1="3" x2="6" y2="21" stroke="black" stroke-width="1"/>
  
  <!-- IELTS text representation with lines -->
  <line x1="8" y1="7" x2="18" y2="7" stroke="black" stroke-width="1.2"/>
  <line x1="8" y1="10" x2="16" y2="10" stroke="black" stroke-width="1.2"/>
  <line x1="8" y1="13" x2="18" y2="13" stroke="black" stroke-width="1.2"/>
  
  <!-- Speaking symbol (microphone or sound waves) -->
  <circle cx="10" cy="17" r="1.5" fill="black"/>
  <path d="M 11.5 17 Q 13 17 13 18.5" fill="none" stroke="black" stroke-width="1"/>
  
  <!-- Listening symbol (headphone or ear) -->
  <circle cx="15" cy="17" r="1.5" fill="black"/>
  <path d="M 16.5 17 Q 18 17 18 18.5" fill="none" stroke="black" stroke-width="1"/>
</svg>